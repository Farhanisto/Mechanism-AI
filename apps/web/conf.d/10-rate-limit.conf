# Protect the public demo from runaway Meta API spend. Only run creation is
# limited; status, SSE and artifact downloads stay available.
#
# Railway terminates TLS at its edge and supplies the client address in
# X-Real-IP. Fall back to the socket address for local/private requests.
map $http_x_real_ip $demo_client_ip {
    default $http_x_real_ip;
    ""      $remote_addr;
}

limit_req_zone $demo_client_ip zone=design_runs:10m rate=8r/m;
limit_req_status 429;
