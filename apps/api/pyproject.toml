[project]
name = "mechanism-ai-api"
version = "0.1.0"
description = "FastAPI orchestration and independent evaluation API for Mechanism AI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "numpy>=2.1,<3",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "scipy>=1.14,<2",
    "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
sim = ["mujoco>=3.2,<4"]
cad = [
    "cadquery>=2.4",
    "rtree>=1.4.1",
    "trimesh>=5.2.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
